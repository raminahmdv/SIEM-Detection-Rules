title: SOC Web - Known Web Scanner User-Agent
id: 7e2a4c91-5d63-48b0-9f17-3c6a8d2b1e11
status: experimental
description: Detects HTTP requests whose User-Agent identifies commonly used vulnerability scanners or web enumeration tools.
author: Ramin Ahmedov
date: 2026-10-03
references:
  - https://attack.mitre.org/techniques/T1595/
logsource:
  category: webserver
detection:
  selection:
    user_agent|re: '(?i)(sqlmap|nikto|nuclei|gobuster|dirbuster|ffuf|wfuzz|wpscan|acunetix|nessus|openvas)'
  condition: selection
falsepositives:
  - Authorized vulnerability scanning
  - Internal security testing
level: medium
tags:
  - attack.t1595
