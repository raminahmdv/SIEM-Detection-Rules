title: SOC Web - Advanced SQL Injection Attempt
id: f4b7a120-13c5-4a9b-8e2d-000000000001
status: experimental
description: Web serverlərə yönəlik mürəkkəb SQL Injection (SQLi) və WAF atlatma cəhdlərini aşkarlayır (OWASP A03).
author: Ramin Ahmedov
date: 2026-10-03
tags:
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|re: '(?i)(union(\s|\+)+select|select.*from|or\s*1\s*=\s*1|sleep\(\d+\)|xp_cmdshell|%27)'
  condition: selection
level: high
