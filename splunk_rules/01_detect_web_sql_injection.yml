title: SOC Web - Advanced SQL Injection Attempt
id: 9a1c0001-0000-0000-0000-000000000001
status: experimental
description: Web serverlərə yönəlik mürəkkəb SQL Injection (SQLi) hücum cəhdlərini aşkarlayır.
author: Ramin Ahmedov
date: 2026-10-03
tags:
  - attack.t1190
logsource:
