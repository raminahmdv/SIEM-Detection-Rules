title: SOC Web - Cross-Site Scripting (XSS) Attempt
id: f4b7a120-13c5-4a9b-8e2d-6f91c0000002
status: experimental
description: Detects common XSS payload indicators in HTTP requests; useful for reflected XSS and payload submission that may precede stored XSS.
author: Ramin Ahmedov
date: 2026-10-03
references:
  - https://owasp.org/www-community/attacks/xss/
logsource:
  category: webserver
detection:
  selection_query:
    url_query|re: '(?i)(<script\b|%3c\s*script\b|javascript\s*%3a|javascript\s*:|onerror\s*=|onload\s*=|onclick\s*=|onmouseover\s*=|onfocus\s*=|<svg\b[^>]*onload\s*=|%3csvg\b)'
  selection_path:
    url_path|re: '(?i)(<script\b|%3c\s*script\b|javascript\s*%3a|onerror\s*=|onload\s*=|onclick\s*=|<svg\b[^>]*onload\s*=|%3csvg\b)'
  condition: 1 of selection_*
falsepositives:
  - Authorized vulnerability scanning
  - Penetration testing
  - Security training payloads
level: high
tags:
  - attack.t1190
